<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CortenCloud — Bot Cloud Hosting</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #05080f;
      --bg2: #0a0f1a;
      --card: #101828;
      --card2: #16213a;
      --card3: #1c2a47;
      --border: #1e2940;
      --border2: #2a3a5c;
      --text: #f2f6fc;
      --muted: #8b9bb8;
      --muted2: #5d6b85;
      --primary: #3b82f6;
      --primary2: #60a5fa;
      --primary-d: #2563eb;
      --accent: #8b5cf6;
      --accent2: #a78bfa;
      --cyan: #22d3ee;
      --success: #22c55e;
      --success2: #4ade80;
      --warning: #f59e0b;
      --danger: #ef4444;
      --danger2: #f87171;
      --radius: 18px;
      --radius-sm: 12px;
      --shadow: 0 24px 60px rgba(0,0,0,.55);
      --glow: 0 0 40px rgba(59,130,246,.18);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.55;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }
    ::selection { background: rgba(59,130,246,.35); }
    .hidden { display: none !important; }
    a { color: inherit; text-decoration: none; }
    code {
      font-family: 'JetBrains Mono', ui-monospace, monospace;
      background: rgba(59,130,246,.12); color: var(--primary2);
      padding: 2px 8px; border-radius: 6px; font-size: .85em;
    }

    /* ===== Buttons ===== */
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      padding: 11px 20px; border-radius: 11px; font-weight: 600; font-size: .9rem;
      border: none; cursor: pointer; text-decoration: none; transition: all .18s ease;
      font-family: inherit; white-space: nowrap; user-select: none;
    }
    .btn:active { transform: translateY(1px) scale(.99); }
    .btn-ghost { background: transparent; color: var(--muted); }
    .btn-ghost:hover { color: var(--text); background: rgba(255,255,255,.06); }
    .btn-outline {
      background: rgba(255,255,255,.02); color: var(--text);
      border: 1px solid var(--border2);
    }
    .btn-outline:hover { border-color: var(--primary); background: rgba(59,130,246,.1); }
    .btn-primary {
      background: linear-gradient(135deg, #3b82f6 0%, #6366f1 100%);
      color: #fff; box-shadow: 0 6px 20px rgba(59,130,246,.4);
    }
    .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 10px 28px rgba(59,130,246,.55); }
    .btn-success { background: linear-gradient(135deg,#22c55e,#16a34a); color:#fff; box-shadow:0 6px 18px rgba(34,197,94,.35); }
    .btn-success:hover { transform: translateY(-2px); }
    .btn-danger { background: linear-gradient(135deg,#ef4444,#dc2626); color:#fff; box-shadow:0 6px 18px rgba(239,68,68,.3); }
    .btn-danger:hover { transform: translateY(-2px); }
    .btn-sm { padding: 8px 14px; font-size: .82rem; border-radius: 9px; }
    .btn-block { width: 100%; }

    /* ===== Top navigation ===== */
    .topnav {
      position: fixed; top: 0; left: 0; right: 0; z-index: 100;
      padding: 14px 28px;
      display: flex; align-items: center; justify-content: space-between; gap: 16px;
      background: rgba(5,8,15,.6);
      backdrop-filter: blur(18px) saturate(140%);
      -webkit-backdrop-filter: blur(18px) saturate(140%);
      border-bottom: 1px solid transparent;
      transition: border-color .25s, background .25s;
    }
    .topnav.scrolled { border-bottom-color: var(--border); background: rgba(5,8,15,.82); }
    .brand {
      display: flex; align-items: center; gap: 11px;
      font-weight: 800; font-size: 1.2rem; letter-spacing: -.02em; color: var(--text);
    }
    .brand-icon {
      width: 38px; height: 38px; border-radius: 11px;
      background: linear-gradient(135deg, var(--primary) 0%, var(--accent) 100%);
      display: flex; align-items: center; justify-content: center;
      font-size: 1.15rem; box-shadow: 0 6px 18px rgba(59,130,246,.4);
      position: relative; overflow: hidden;
    }
    .brand-icon::after {
      content:''; position:absolute; inset:0;
      background: linear-gradient(135deg, transparent 40%, rgba(255,255,255,.25) 50%, transparent 60%);
    }
    .nav-right { display: flex; gap: 10px; align-items: center; }

    /* ===== Language switcher ===== */
    .lang-switch {
      display: inline-flex; gap: 2px; padding: 3px;
      background: rgba(255,255,255,.04); border: 1px solid var(--border);
      border-radius: 999px;
    }
    .lang-btn {
      padding: 5px 12px; border-radius: 999px; border: none; cursor: pointer;
      background: transparent; color: var(--muted); font-weight: 600; font-size: .78rem;
      font-family: inherit; transition: all .15s;
    }
    .lang-btn:hover { color: var(--text); }
    .lang-btn.active {
      background: linear-gradient(135deg, var(--primary), var(--accent));
      color: #fff; box-shadow: 0 3px 10px rgba(59,130,246,.4);
    }

    /* ===== Landing ===== */
    #landing {
      min-height: 100vh; position: relative; overflow: hidden;
      background:
        radial-gradient(ellipse 80% 60% at 50% -10%, rgba(59,130,246,.22), transparent 60%),
        radial-gradient(ellipse 50% 50% at 85% 30%, rgba(139,92,246,.14), transparent 60%),
        radial-gradient(ellipse 40% 50% at 15% 70%, rgba(34,211,238,.08), transparent 60%),
        var(--bg);
    }
    #landing::before {
      content:''; position:absolute; inset:0; pointer-events:none; opacity:.4;
      background-image:
        linear-gradient(rgba(255,255,255,.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.025) 1px, transparent 1px);
      background-size: 60px 60px;
      mask-image: radial-gradient(ellipse 70% 60% at 50% 40%, #000 30%, transparent 75%);
      -webkit-mask-image: radial-gradient(ellipse 70% 60% at 50% 40%, #000 30%, transparent 75%);
    }
    .hero {
      position: relative; z-index: 1;
      padding: 150px 24px 90px; max-width: 1100px; margin: 0 auto; text-align: center;
    }
    .hero-badge {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 7px 16px; border-radius: 999px;
      background: rgba(59,130,246,.12); border: 1px solid rgba(59,130,246,.28);
      color: var(--primary2); font-size: .85rem; font-weight: 500; margin-bottom: 26px;
      backdrop-filter: blur(8px);
    }
    .hero-badge .dot {
      width: 7px; height: 7px; border-radius: 50%; background: var(--success2);
      box-shadow: 0 0 10px var(--success2); animation: pulse 2s infinite;
    }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }
    .hero h1 {
      font-size: clamp(2.3rem, 6vw, 4rem); font-weight: 800;
      letter-spacing: -.035em; line-height: 1.1; margin-bottom: 22px;
    }
    .hero h1 .grad {
      background: linear-gradient(120deg, #60a5fa 0%, #a78bfa 50%, #22d3ee 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text; background-size: 200% auto; animation: shimmer 5s linear infinite;
    }
    @keyframes shimmer { to { background-position: 200% center; } }
    .hero p {
      color: var(--muted); font-size: 1.15rem; max-width: 560px;
      margin: 0 auto 36px; line-height: 1.65;
    }
    .hero-cta { display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; }
    .hero-cta .btn { padding: 15px 30px; font-size: 1.02rem; }
    .hero-stats {
      display: flex; gap: 40px; justify-content: center; flex-wrap: wrap;
      margin-top: 64px;
    }
    .hero-stat .n { font-size: 1.8rem; font-weight: 800; color: var(--text); }
    .hero-stat .n .grad { background: linear-gradient(135deg,#60a5fa,#a78bfa); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; }
    .hero-stat .l { color: var(--muted2); font-size: .82rem; margin-top: 2px; }

    .features {
      position: relative; z-index: 1;
      max-width: 1100px; margin: 0 auto; padding: 20px 24px 100px;
    }
    .section-title { text-align: center; margin-bottom: 44px; }
    .section-title h2 { font-size: clamp(1.6rem, 3vw, 2rem); font-weight: 800; margin-bottom: 10px; letter-spacing: -.02em; }
    .section-title p { color: var(--muted); font-size: 1rem; }
    .feature-grid {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 18px;
    }
    .feature {
      position: relative; background: linear-gradient(160deg, var(--card), var(--bg2));
      border: 1px solid var(--border); border-radius: var(--radius);
      padding: 30px 26px; transition: all .25s; overflow: hidden;
    }
    .feature::before {
      content:''; position:absolute; top:0; left:0; right:0; height:1px;
      background: linear-gradient(90deg, transparent, rgba(59,130,246,.5), transparent);
      opacity:0; transition: opacity .25s;
    }
    .feature:hover { border-color: rgba(59,130,246,.45); transform: translateY(-4px); box-shadow: 0 20px 40px rgba(0,0,0,.4); }
    .feature:hover::before { opacity: 1; }
    .feature-icon {
      width: 52px; height: 52px; border-radius: 14px;
      background: linear-gradient(135deg, rgba(59,130,246,.18), rgba(139,92,246,.18));
      border: 1px solid rgba(59,130,246,.2);
      display: flex; align-items: center; justify-content: center;
      font-size: 1.5rem; margin-bottom: 18px;
    }
    .feature h3 { font-size: 1.12rem; margin-bottom: 8px; font-weight: 700; }
    .feature p { color: var(--muted); font-size: .92rem; line-height: 1.6; }

    .pricing { position: relative; z-index: 1; max-width: 1100px; margin: 0 auto; padding: 20px 24px 100px; }
    .price-grid {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px;
      align-items: stretch;
    }
    .price-card {
      background: linear-gradient(160deg, var(--card), var(--bg2));
      border: 1px solid var(--border); border-radius: var(--radius);
      padding: 34px 26px; text-align: center; position: relative; overflow: hidden;
      display: flex; flex-direction: column;
      transition: all .25s;
    }
    .price-card:hover { transform: translateY(-4px); border-color: var(--border2); }
    .price-card.popular {
      border-color: var(--primary);
      box-shadow: 0 0 0 1px var(--primary), 0 24px 50px rgba(59,130,246,.2);
      background: linear-gradient(160deg, var(--card3), var(--card));
    }
    .price-card.popular::before {
      content: attr(data-tag); position: absolute; top: 16px; right: -34px;
      background: linear-gradient(135deg, var(--primary), var(--accent)); color: #fff;
      font-size: .68rem; font-weight: 700; text-transform: uppercase; letter-spacing: .05em;
      padding: 5px 40px; transform: rotate(45deg);
    }
    .price-card h3 { font-size: 1.15rem; font-weight: 700; margin-bottom: 4px; }
    .price-card .amount {
      font-size: 2.4rem; font-weight: 800; margin: 14px 0 4px;
      background: linear-gradient(135deg, var(--primary2), var(--accent2));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
    }
    .price-card .unit { color: var(--muted); font-size: .88rem; margin-bottom: 22px; }
    .price-card ul { list-style: none; text-align: left; margin-bottom: 24px; flex: 1; }
    .price-card li {
      padding: 7px 0; font-size: .9rem; color: var(--muted);
      display: flex; gap: 9px; align-items: center;
    }
    .price-card li::before { content: '\2713'; color: var(--success2); font-weight: 700; }

    .footer-land {
      position: relative; z-index: 1; text-align: center; padding: 36px 24px;
      border-top: 1px solid var(--border); color: var(--muted2); font-size: .85rem;
    }

    /* ===== Modal ===== */
    .modal-overlay {
      position: fixed; inset: 0; z-index: 300;
      background: rgba(0,0,0,.7); backdrop-filter: blur(8px);
      display: flex; align-items: center; justify-content: center; padding: 20px;
      opacity: 0; pointer-events: none; transition: opacity .25s;
    }
    .modal-overlay.open { opacity: 1; pointer-events: auto; }
    .modal {
      background: linear-gradient(160deg, var(--card), var(--bg2));
      border: 1px solid var(--border2); border-radius: 22px;
      padding: 38px 34px; width: 100%; max-width: 420px; box-shadow: var(--shadow);
      transform: translateY(16px) scale(.98); transition: transform .28s cubic-bezier(.2,.8,.2,1);
      position: relative; max-height: 92vh; overflow-y: auto;
    }
    .modal-overlay.open .modal { transform: translateY(0) scale(1); }
    .modal h2 { font-size: 1.5rem; margin-bottom: 6px; text-align: center; font-weight: 800; }
    .modal .sub { text-align: center; color: var(--muted); font-size: .9rem; margin-bottom: 26px; }
    .form-group { margin-bottom: 16px; }
    .form-group label {
      display: block; margin-bottom: 7px; font-size: .85rem; font-weight: 500; color: var(--muted);
    }
    .form-control {
      width: 100%; padding: 12px 15px;
      background: var(--bg); border: 1px solid var(--border2);
      border-radius: 11px; color: var(--text); font-size: .95rem;
      font-family: inherit; transition: all .15s;
    }
    .form-control:focus {
      outline: none; border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(59,130,246,.22); background: var(--bg2);
    }
    textarea.form-control { resize: vertical; min-height: 90px; }
    .form-error {
      color: var(--danger2); font-size: .85rem; text-align: center;
      min-height: 20px; margin-top: 12px;
    }
    .form-switch { text-align: center; margin-top: 20px; font-size: .9rem; color: var(--muted); }
    .form-switch a { color: var(--primary2); cursor: pointer; font-weight: 600; }
    .form-switch a:hover { text-decoration: underline; }
    .modal-close {
      position: absolute; top: 16px; right: 16px;
      width: 32px; height: 32px; border-radius: 9px;
      background: rgba(255,255,255,.05); border: none; color: var(--muted);
      font-size: 1.2rem; cursor: pointer; line-height: 1; transition: all .15s;
    }
    .modal-close:hover { background: rgba(255,255,255,.1); color: var(--text); }

    /* ===== App shell ===== */
    #app { display: none; min-height: 100vh; background: var(--bg); position: relative; }
    #app::before {
      content:''; position: fixed; inset: 0; z-index: 0; pointer-events: none;
      background:
        radial-gradient(ellipse 60% 40% at 50% -5%, rgba(59,130,246,.12), transparent 60%),
        radial-gradient(ellipse 40% 40% at 90% 100%, rgba(139,92,246,.08), transparent 60%);
    }
    .app-nav {
      position: sticky; top: 0; z-index: 60;
      padding: 12px 20px;
      display: flex; align-items: center; justify-content: space-between; gap: 14px;
      background: rgba(5,8,15,.8); backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border);
    }
    .app-nav-left { display: flex; align-items: center; gap: 12px; }
    .hamburger {
      width: 42px; height: 42px; border-radius: 11px; cursor: pointer;
      background: rgba(255,255,255,.04); border: 1px solid var(--border2);
      display: flex; align-items: center; justify-content: center; gap: 4px;
      flex-direction: column; transition: all .18s;
    }
    .hamburger:hover { background: rgba(59,130,246,.12); border-color: var(--primary); }
    .hamburger span {
      display: block; width: 18px; height: 2px; border-radius: 2px;
      background: var(--text); transition: all .2s;
    }
    .app-nav-right { display: flex; align-items: center; gap: 10px; }
    .user-chip {
      display: flex; align-items: center; gap: 10px;
      background: var(--card); border: 1px solid var(--border);
      border-radius: 999px; padding: 5px 14px 5px 5px;
    }
    .avatar {
      width: 34px; height: 34px; border-radius: 50%;
      background: linear-gradient(135deg, var(--primary), var(--accent));
      display: flex; align-items: center; justify-content: center;
      font-weight: 700; font-size: .9rem; color: #fff;
    }
    .user-chip .name { font-size: .88rem; font-weight: 600; line-height: 1.2; }
    .user-chip .bal { font-size: .75rem; color: var(--muted); line-height: 1.2; }

    /* ===== Drawer ===== */
    .drawer-bd {
      position: fixed; inset: 0; z-index: 150;
      background: rgba(0,0,0,.55); backdrop-filter: blur(4px);
      opacity: 0; pointer-events: none; transition: opacity .25s;
    }
    .drawer-bd.open { opacity: 1; pointer-events: auto; }
    .drawer {
      position: fixed; top: 0; left: 0; bottom: 0; z-index: 160;
      width: 290px; max-width: 85vw;
      background: linear-gradient(180deg, var(--card), var(--bg2));
      border-right: 1px solid var(--border);
      transform: translateX(-100%); transition: transform .3s cubic-bezier(.2,.8,.2,1);
      display: flex; flex-direction: column; box-shadow: var(--shadow);
    }
    .drawer.open { transform: translateX(0); }
    .drawer-head {
      padding: 20px 22px; display: flex; align-items: center; justify-content: space-between;
      border-bottom: 1px solid var(--border);
    }
    .drawer-head .brand { font-size: 1.1rem; }
    .drawer-close {
      width: 34px; height: 34px; border-radius: 9px; cursor: pointer;
      background: rgba(255,255,255,.05); border: none; color: var(--muted);
      font-size: 1.3rem; line-height: 1; transition: all .15s;
    }
    .drawer-close:hover { background: rgba(255,255,255,.1); color: var(--text); }
    .drawer-nav { flex: 1; overflow-y: auto; padding: 14px 12px; }
    .drawer-nav::-webkit-scrollbar { width: 6px; }
    .drawer-nav::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 3px; }
    .drawer-item {
      display: flex; align-items: center; gap: 12px;
      padding: 11px 14px; border-radius: 11px; cursor: pointer;
      color: var(--muted); font-weight: 500; font-size: .92rem;
      transition: all .15s; margin-bottom: 3px; border: 1px solid transparent;
    }
    .drawer-item:hover { background: rgba(59,130,246,.1); color: var(--text); }
    .drawer-item.active {
      background: linear-gradient(135deg, rgba(59,130,246,.18), rgba(139,92,246,.12));
      color: var(--text); border-color: rgba(59,130,246,.3);
    }
    .drawer-item .ic { font-size: 1.15rem; width: 22px; text-align: center; }
    .drawer-item .badge-count {
      margin-left: auto; background: var(--danger); color: #fff;
      font-size: .68rem; font-weight: 700; padding: 2px 7px; border-radius: 999px;
    }
    .drawer-foot { padding: 16px 14px; border-top: 1px solid var(--border); }
    .drawer-foot .lang-switch { width: 100%; justify-content: center; margin-bottom: 12px; }

    /* ===== App body ===== */
    .app-body { position: relative; z-index: 1; max-width: 1080px; margin: 0 auto; padding: 28px 20px 70px; }
    .page { display: none; }
    .page.active { display: block; animation: fadeIn .3s ease; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

    .welcome {
      margin-bottom: 26px; display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap;
    }
    .welcome h1 { font-size: 1.7rem; font-weight: 800; margin-bottom: 4px; letter-spacing: -.02em; }
    .welcome p { color: var(--muted); font-size: .92rem; }
    .welcome .clid { color: var(--primary2); }

    .back {
      display: inline-flex; align-items: center; gap: 8px;
      color: var(--muted); font-size: .88rem; cursor: pointer;
      margin-bottom: 18px; font-weight: 600; font-family: inherit;
      background: rgba(255,255,255,.04); border: 1px solid var(--border);
      padding: 8px 14px; border-radius: 10px; transition: all .15s;
    }
    .back:hover { color: var(--text); border-color: var(--primary); background: rgba(59,130,246,.1); transform: translateX(-2px); }
    .back .arrow { font-size: 1.05rem; }

    .card {
      background: linear-gradient(160deg, var(--card), var(--bg2));
      border: 1px solid var(--border); border-radius: var(--radius);
      padding: 26px; margin-bottom: 18px;
    }
    .card h2 { font-size: 1.22rem; margin-bottom: 18px; font-weight: 700; display: flex; align-items: center; gap: 9px; }
    .card .sub-h { font-size: 1.05rem; margin: 24px 0 14px; font-weight: 700; }

    /* ===== Stat cards ===== */
    .stat-row {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 14px; margin-bottom: 26px;
    }
    .stat-card {
      background: linear-gradient(160deg, var(--card), var(--bg2));
      border: 1px solid var(--border); border-radius: 14px; padding: 18px 20px;
      position: relative; overflow: hidden; transition: all .2s;
    }
    .stat-card:hover { border-color: var(--border2); transform: translateY(-2px); }
    .stat-card .label { color: var(--muted); font-size: .78rem; margin-bottom: 6px; display: flex; align-items: center; gap: 6px; }
    .stat-card .label .si { font-size: .95rem; }
    .stat-card .value { font-size: 1.6rem; font-weight: 800; letter-spacing: -.02em; }
    .stat-card .value.blue { color: var(--primary2); }
    .stat-card .value.green { color: var(--success2); }
    .stat-card .value.amber { color: var(--warning); }
    .stat-card .value.purple { color: var(--accent2); }

    /* ===== Quick actions ===== */
    .quick-row {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 14px; margin-bottom: 26px;
    }
    .quick-card {
      background: linear-gradient(135deg, var(--card), var(--card2));
      border: 1px solid var(--border); border-radius: 14px; padding: 22px 18px;
      text-align: center; cursor: pointer; transition: all .2s; position: relative; overflow: hidden;
    }
    .quick-card::before {
      content:''; position:absolute; inset:0; opacity:0; transition: opacity .2s;
      background: radial-gradient(circle at 50% 0%, rgba(59,130,246,.18), transparent 70%);
    }
    .quick-card:hover { transform: translateY(-3px); border-color: var(--primary); box-shadow: 0 12px 28px rgba(0,0,0,.35); }
    .quick-card:hover::before { opacity: 1; }
    .quick-card .ic { font-size: 1.9rem; margin-bottom: 10px; }
    .quick-card .lb { font-weight: 600; font-size: .92rem; }

    /* ===== Dashboard grid ===== */
    .dash-grid {
      display: grid; grid-template-columns: 1.4fr 1fr; gap: 18px; margin-bottom: 18px;
    }
    @media (max-width: 820px) { .dash-grid { grid-template-columns: 1fr; } }

    /* ===== Activity timeline ===== */
    .timeline { display: flex; flex-direction: column; gap: 2px; }
    .tl-item {
      display: flex; gap: 13px; padding: 11px 0; border-bottom: 1px solid var(--border);
    }
    .tl-item:last-child { border-bottom: none; }
    .tl-dot {
      width: 32px; height: 32px; border-radius: 9px; flex-shrink: 0;
      background: rgba(59,130,246,.12); display: flex; align-items: center; justify-content: center;
      font-size: 1rem;
    }
    .tl-body { flex: 1; min-width: 0; }
    .tl-body .txt { font-size: .88rem; }
    .tl-body .time { font-size: .74rem; color: var(--muted2); margin-top: 2px; }

    /* ===== Announcement ===== */
    .ann-item {
      padding: 13px 15px; border-radius: 12px; margin-bottom: 10px;
      background: rgba(59,130,246,.08); border: 1px solid rgba(59,130,246,.2);
      font-size: .88rem; display: flex; gap: 10px; align-items: flex-start;
    }
    .ann-item .ai { font-size: 1.05rem; }
    .ann-item.warn { background: rgba(245,158,11,.08); border-color: rgba(245,158,11,.25); }

    /* ===== Spending chart ===== */
    .chart-wrap { display: flex; align-items: flex-end; gap: 10px; height: 150px; padding-top: 10px; }
    .chart-bar { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 7px; height: 100%; justify-content: flex-end; }
    .chart-bar .bar {
      width: 100%; max-width: 38px; border-radius: 7px 7px 0 0;
      background: linear-gradient(180deg, var(--primary2), var(--primary-d));
      min-height: 3px; transition: height .4s ease; position: relative;
    }
    .chart-bar .bar.zero { background: var(--border2); }
    .chart-bar .lab { font-size: .7rem; color: var(--muted2); }
    .chart-bar .val { font-size: .68rem; color: var(--muted); }

    /* ===== Table ===== */
    table { width: 100%; border-collapse: collapse; font-size: .9rem; }
    th, td { padding: 13px 10px; text-align: left; border-bottom: 1px solid var(--border); }
    th { color: var(--muted); font-size: .72rem; text-transform: uppercase; letter-spacing: .05em; font-weight: 600; }
    tr:last-child td { border-bottom: none; }
    tbody tr:hover { background: rgba(255,255,255,.02); }
    .badge {
      display: inline-block; padding: 3px 11px; border-radius: 999px;
      font-size: .74rem; font-weight: 600;
    }
    .badge-active { background: rgba(34,197,94,.15); color: var(--success2); }
    .badge-pending { background: rgba(245,158,11,.15); color: var(--warning); }
    .badge-in { background: rgba(34,211,238,.15); color: var(--cyan); }
    .badge-out { background: rgba(239,68,68,.15); color: var(--danger2); }

    /* ===== Flash ===== */
    .flash { padding: 12px 15px; border-radius: 11px; margin-top: 14px; font-size: .9rem; display: flex; gap: 9px; align-items: center; }
    .flash-ok { background: rgba(34,197,94,.12); color: var(--success2); border: 1px solid rgba(34,197,94,.25); }
    .flash-err { background: rgba(239,68,68,.12); color: var(--danger2); border: 1px solid rgba(239,68,68,.25); }
    .empty { text-align: center; padding: 44px 20px; color: var(--muted); }
    .empty .ic { font-size: 2.6rem; margin-bottom: 12px; opacity: .5; }

    /* ===== Settings ===== */
    .setting-row { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 16px 0; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
    .setting-row:last-child { border-bottom: none; }
    .setting-row .lab { font-weight: 600; font-size: .95rem; }
    .setting-row .desc { color: var(--muted); font-size: .82rem; margin-top: 2px; }
    .danger-zone { border-color: rgba(239,68,68,.3); }

    .kv { display: grid; grid-template-columns: 130px 1fr; gap: 10px 16px; align-items: center; }
    .kv .k { color: var(--muted); font-size: .88rem; }
    .kv .v { font-weight: 600; font-size: .92rem; }

    @media (max-width: 600px) {
      .topnav { padding: 12px 16px; }
      .hero { padding: 120px 16px 60px; }
      .hero-stats { gap: 26px; margin-top: 44px; }
      .app-body { padding: 20px 14px 50px; }
      .modal { padding: 30px 22px; }
      .welcome h1 { font-size: 1.4rem; }
      .nav-right .lang-switch { display: none; }
      th, td { padding: 10px 6px; font-size: .82rem; }
      .kv { grid-template-columns: 1fr; gap: 4px; }
      .kv .k { font-size: .78rem; }
    }

    /* ===== Chat ===== */
    .chat-box { display:flex; flex-direction:column; gap:10px; max-height:380px; overflow-y:auto; padding:6px 4px; }
    .chat-box::-webkit-scrollbar { width:6px; } .chat-box::-webkit-scrollbar-thumb { background:var(--border2); border-radius:3px; }
    .chat-msg { max-width:78%; padding:10px 14px; border-radius:14px; font-size:.9rem; word-break:break-word; }
    .chat-msg.user { align-self:flex-end; background:linear-gradient(135deg,var(--primary),var(--primary-d)); color:#fff; border-bottom-right-radius:4px; }
    .chat-msg.admin { align-self:flex-start; background:var(--card2); border:1px solid var(--border2); border-bottom-left-radius:4px; }
    .chat-msg .meta { font-size:.68rem; opacity:.7; margin-top:4px; }
    .chat-msg.unread { box-shadow:0 0 0 2px rgba(139,92,246,.5); }
    .chat-input { display:flex; gap:10px; margin-top:14px; }
    .chat-input .form-control { flex:1; }

    /* ===== Bot view ===== */
    .bot-head { display:flex; align-items:center; gap:14px; flex-wrap:wrap; margin-bottom:18px; }
    .bot-head .bt-title { font-size:1.3rem; font-weight:800; }
    .bot-head .bt-file { font-family:'JetBrains Mono',monospace; color:var(--primary2); }
    .file-list { display:flex; flex-direction:column; gap:6px; margin-bottom:14px; }
    .file-item { display:flex; align-items:center; gap:10px; padding:9px 12px; background:var(--bg); border:1px solid var(--border); border-radius:9px; font-size:.85rem; }
    .file-item .fn { font-family:'JetBrains Mono',monospace; color:var(--success2); }
    .file-add { display:flex; gap:10px; flex-wrap:wrap; }
    .file-add .form-control { flex:1; min-width:160px; }
    .console {
      background:#070b13; border:1px solid var(--border); border-radius:10px; padding:14px;
      font-family:'JetBrains Mono',monospace; font-size:.78rem; color:#7dd3fc;
      height:230px; overflow-y:auto; white-space:pre-wrap; word-break:break-word; line-height:1.6;
    }
    .console::-webkit-scrollbar { width:6px; } .console::-webkit-scrollbar-thumb { background:#1e3a5f; border-radius:3px; }
    .console .ok { color:var(--success2); } .console .warn { color:var(--warning); } .console .err { color:var(--danger2); }
    .console .dim { color:var(--muted2); }
    .console-btns { display:flex; gap:8px; flex-wrap:wrap; margin-top:12px; }
    .log-list { display:flex; flex-direction:column; gap:4px; max-height:200px; overflow-y:auto; }
    .log-item { font-size:.82rem; padding:6px 10px; border-left:2px solid var(--primary); background:rgba(59,130,246,.06); border-radius:0 6px 6px 0; }
    .log-item .lt { color:var(--muted2); font-size:.72rem; margin-right:8px; }
    .bot-info { display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:12px; margin-bottom:18px; }
    .bot-info .bi { background:var(--bg); border:1px solid var(--border); border-radius:10px; padding:10px 12px; }
    .bot-info .bi .bk { font-size:.72rem; color:var(--muted2); }
    .bot-info .bi .bv { font-weight:600; font-size:.9rem; margin-top:2px; }

    /* ===== Admin panel (distinct) ===== */
    .admin-hero {
      background:linear-gradient(135deg,rgba(139,92,246,.22),rgba(59,130,246,.12));
      border:1px solid rgba(139,92,246,.3); border-radius:var(--radius);
      padding:26px 28px; margin-bottom:18px;
    }
    .admin-hero h2 { font-size:1.4rem; font-weight:800; }
    .admin-hero p { color:var(--muted); font-size:.9rem; margin-top:4px; }
    .admin-grid { display:grid; grid-template-columns:1fr 1fr; gap:18px; }
    @media (max-width:820px){ .admin-grid{ grid-template-columns:1fr; } }
    .sec { background:linear-gradient(160deg,var(--card),var(--bg2)); border:1px solid var(--border); border-radius:var(--radius); padding:24px; margin-bottom:18px; }
    .sec.violet { border-color:rgba(139,92,246,.25); }
    .sec-head { display:flex; align-items:center; gap:9px; font-weight:700; font-size:1.05rem; padding-bottom:14px; margin-bottom:16px; border-bottom:1px solid var(--border); }
    .sec-head .si { font-size:1.2rem; }
    .stat-card.violet .value { color:var(--accent2); }
    .promo-row { display:flex; align-items:center; gap:10px; padding:10px 0; border-bottom:1px solid var(--border); flex-wrap:wrap; }
    .promo-row:last-child { border-bottom:none; }
    .promo-row .pc { font-family:'JetBrains Mono',monospace; font-weight:700; color:var(--accent2); }
    .promo-add { display:flex; gap:10px; flex-wrap:wrap; margin-bottom:14px; }
    .promo-add .form-control { flex:1; min-width:120px; }
    .conv-card { display:flex; align-items:center; gap:12px; padding:14px; background:var(--bg); border:1px solid var(--border); border-radius:12px; cursor:pointer; transition:all .15s; margin-bottom:10px; }
    .conv-card:hover { border-color:var(--primary); background:var(--card2); }
    .conv-card .ca { width:40px; height:40px; border-radius:50%; background:linear-gradient(135deg,var(--primary),var(--accent)); display:flex; align-items:center; justify-content:center; font-weight:700; color:#fff; }
    .conv-card .cb { flex:1; min-width:0; }
    .conv-card .cn { font-weight:600; font-size:.92rem; }
    .conv-card .cl { font-size:.8rem; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .conv-card .cu { background:var(--danger); color:#fff; font-size:.7rem; font-weight:700; padding:2px 8px; border-radius:999px; }
    .conv-card.active { border-color:var(--primary); background:var(--card2); }
    .msg-layout { display:grid; grid-template-columns:240px 1fr; gap:16px; }
    @media (max-width:720px){ .msg-layout{ grid-template-columns:1fr; } }
    .conv-list { max-height:480px; overflow-y:auto; }
  </style>
</head>
<body>

<!-- ============ LANDING ============ -->

  <section class="hero">

let curLang = localStorage.getItem('cc_lang') || 'uz';
function t(k){ return (I18N[curLang] && I18N[curLang][k]) || I18N.uz[k] || k; }
function tf(k, p){ let s = t(k); if(p){ for(const key in p){ s = s.split('{'+key+'}').join(p[key]); } } return s; }
function setLang(l){
  curLang = l; localStorage.setItem('cc_lang', l);
  document.documentElement.lang = l;
  applyI18n();
  // refresh dynamic views
  if (state.current && user()) {
    renderDrawer();
    const active = document.querySelector('.page.active');
    if (active) showPage(active.id.replace('page-',''));
  }
}
function applyI18n(){
  document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = t(el.dataset.i18n); });
  document.querySelectorAll('[data-i18n-ph]').forEach(el => { el.placeholder = t(el.dataset.i18nPh); });
  // upload plan options
  const sel = document.getElementById('up-plan');
  if (sel){
    const opts = ['monthly','yearly','daily'];

    };

  ];

function user(){ return state.current && state.users ? state.users[state.current] : null; }
function migrateBot(b){
  if (!b.id) b.id = Date.now() + Math.floor(Math.random()*100000);
  if (!b.files) b.files = b.file ? [b.file] : [];
  if (!b.console) b.console = [];
  if (!b.logs) b.logs = [{ key:'log_created', params:{}, time: b.createdAt || Date.now() }];
  if (b.started === undefined) b.started = false;
  if (!b.createdAt) b.createdAt = Date.now();
}
function ensureUserFields(u){
  if (!u.bots) u.bots = [];
  u.bots.forEach(migrateBot);
  if (!u.messages) u.messages = [];
  if (!u.transactions) u.transactions = [];
  if (!u.activity) u.activity = [];
  if (!u.readNotifs) u.readNotifs = [];
  if (!u.usedPromos) u.usedPromos = [];
}
function addActivity(u, key, params){
  u.activity.unshift({ key, params: params||{}, time: Date.now() });
  if (u.activity.length > 50) u.activity.length = 50;
}
function addTx(u, type, amount, descKey, params){
  u.transactions.unshift({ type, amount, descKey, params: params||{}, time: Date.now() });
  if (u.transactions.length > 100) u.transactions.length = 100;
}
function findBot(id){
  const u = user(); if (!u) return null;
  return u.bots.find(b => String(b.id) === String(id)) || null;
}
function adminUnreadCount(){
  let n = 0;
  Object.values(state.users).forEach(u => {
    if (u.isAdmin) return;
    (u.messages||[]).forEach(m => { if (m.from === 'user' && !m.readByAdmin) n++; });
  });
  return n;
}
function userUnreadAdminCount(u){
  return (u.messages||[]).filter(m => m.from === 'admin' && !m.readByUser).length;
}
function fmtMoney(n){ return Number(n||0).toLocaleString('ru-RU'); }
function nowTs(){ const d=new Date(); return d.toLocaleTimeString(curLang==='uz'?'uz-UZ':curLang==='ru'?'ru-RU':'en-GB',{hour12:false}); }
function fmtTime(ts){
  const d = new Date(ts);
  return d.toLocaleString(curLang === 'uz' ? 'uz-UZ' : curLang === 'ru' ? 'ru-RU' : 'en-GB',
    { day:'2-digit', month:'2-digit', year:'numeric', hour:'2-digit', minute:'2-digit' });
}
function esc(s){ const d=document.createElement('div'); d.textContent = s==null?'':String(s); return d.innerHTML; }

function doRegister(){

  err.textContent = '';
  if (!nick || nick.length < 3) { err.textContent = t('err_nickshort'); return; }
  if (!email || !email.includes('@')) { err.textContent = t('err_email'); return; }
  if (pass.length < 6) { err.textContent = t('err_passshort'); return; }
  if (pass !== pass2) { err.textContent = t('err_passmatch'); return; }
  if (nick.toLowerCase() === 'admin') { err.textContent = t('err_nicktaken'); return; }
  if (state.users[nick]) { err.textContent = t('err_nicktaken'); return; }

function renderChart(){
  // group deploy spend by month, last 6 months
  const now = new Date();
  const months = [];
  for (let i=5; i>=0; i--){
    const d = new Date(now.getFullYear(), now.getMonth()-i, 1);
    months.push({ ym: d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'), label: d.toLocaleString(curLang==='uz'?'uz-UZ':curLang==='ru'?'ru-RU':'en-GB',{month:'short'}), sum:0 });
  }
  const u = user();
  u.transactions.forEach(tx => {
    if (tx.type !== 'deploy') return;
    const d = new Date(tx.time);
    const ym = d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
    const m = months.find(x => x.ym === ym);
    if (m) m.sum += tx.amount;
  });
  const max = Math.max(1, ...months.map(m => m.sum));
  document.getElementById('dash-chart').innerHTML = months.map(m =>
    '<div class="chart-bar"><div class="val">'+(m.sum? fmtMoney(m.sum):'')+'</div>'+
    '<div class="bar'+(m.sum?'':' zero')+'" style="height:'+(m.sum? Math.max(6, (m.sum/max)*130) : 4)+'px"></div>'+
    '<div class="lab">'+m.label+'</div></div>'
  ).join('');
}

function doUpload(){
  const u = user();
  const plan = document.getElementById('up-plan').value;
  const file = document.getElementById('up-file').value.trim();
  const days = parseInt(document.getElementById('up-days').value, 10) || 7;
  const box = document.getElementById('up-msg');
  if (!file){ box.innerHTML = '<div class="flash flash-err">⚠ '+t('msg_upload_needfile')+'</div>'; return; }
  let price = plan === 'daily' ? days * DAILY : PRICES[plan];
  if (u.balance < price){
    box.innerHTML = '<div class="flash flash-err">⚠ '+t('msg_upload_nobalance')+fmtMoney(price)+t('msg_upload_after')+'</div>'; return;
  }
  u.balance -= price;
  state.earned = (state.earned || 0) + price;
  const ts = nowTs();
  const bot = {
    id: Date.now() + Math.floor(Math.random()*100000),
    file, plan, price,
    days: plan === 'daily' ? days : (plan === 'monthly' ? 30 : 365),
    status:'active', date: new Date().toLocaleString(), createdAt: Date.now(),
    files:[file],
    console: [
      '['+ts+'] Deploying bot: '+file,
      '['+ts+'] Tariff: '+t('planname_'+plan),
      '['+ts+'] Status: <span class="ok">active</span>',
      '['+ts+'] '+t('console_ready')
    ],
    logs: [{ key:'log_created', params:{}, time: Date.now() }],
    started:false
  };
  u.bots.push(bot);
  addTx(u, 'out', price, 'tx_deploy');
  addActivity(u, 'act_deploy', { file });
  save();
  box.innerHTML = '<div class="flash flash-ok">✓ '+t('msg_upload_ok')+fmtMoney(price)+' '+t('som')+'</div>';
  document.getElementById('up-file').value = '';
  document.getElementById('up-promo').value = '';
  updateNav(); renderDrawer();
}

  const u = user();
  const box = document.getElementById('bots-box');
  if (!u.bots.length){
    box.innerHTML = '<div class="empty"><div class="ic">📂</div><p>'+t('p_mybots_empty')+'</p><button class="btn btn-primary btn-sm" style="margin-top:12px" onclick="showPage(\'upload\')">'+t('p_mybots_deploy')+'</button></div>';
    return;
  }
  box.innerHTML = '<table><thead><tr><th>'+t('p_mybots_file')+'</th><th>'+t('p_mybots_plan')+'</th><th>'+t('p_mybots_price')+'</th><th>'+t('p_mybots_status')+'</th><th>'+t('p_mybots_actions')+'</th></tr></thead><tbody>' +
    u.bots.map((b) => {
      const cls = b.status === 'active' ? 'badge-active' : 'badge-pending';
      const lab = t('status_' + b.status);
      const pl = t('planname_'+b.plan) + (b.plan==='daily'?' ('+b.days+' '+t('days_word')+')':'');
      return '<tr style="cursor:pointer" onclick="openBotView(\''+b.id+'\')"><td>🤖 '+esc(b.file)+'</td><td>'+pl+'</td><td>'+fmtMoney(b.price)+'</td><td><span class="badge '+cls+'">'+lab+'</span></td><td><button class="btn btn-outline btn-sm" onclick="event.stopPropagation();openBotView(\''+b.id+'\')">'+t('p_messages_open')+'</button> <button class="btn btn-danger btn-sm" onclick="event.stopPropagation();delBot(\''+b.id+'\')">'+t('p_mybots_delete')+'</button></td></tr>';
    }).join('') + '</tbody></table>';
}
function delBot(id){
  const u = user();
  const i = u.bots.findIndex(b => String(b.id) === String(id));
  if (i < 0) return;
  const b = u.bots[i];
  if (b && botTimers[b.id]){ clearInterval(botTimers[b.id]); delete botTimers[b.id]; }
  u.bots.splice(i, 1);
  if (b) addActivity(u, 'act_delbot', { file: b.file });
  save();
  renderBots(); renderDrawer();
}

function renderPromo(){
  const u = user();
  document.getElementById('promo-msg').innerHTML = '';
  const list = Object.keys(state.promos).map(code => {
    const used = u.usedPromos.includes(code);
    return '<div class="ann-item'+(used?' warn':'')+'"><span class="ai">'+(used?'✅':'🎟')+'</span><span><b>'+code+'</b> — +'+fmtMoney(state.promos[code])+' '+t('som')+(used?' · '+t('p_promo_used'):'')+'</span></div>';
  }).join('');
  document.getElementById('promo-list').innerHTML = list;
}
function doPromo(){
  const u = user();
  const code = document.getElementById('promo-code').value.trim().toUpperCase();
  const box = document.getElementById('promo-msg');
  if (!code || !state.promos[code] || u.usedPromos.includes(code)){
    box.innerHTML = '<div class="flash flash-err">⚠ '+t('msg_promo_invalid')+'</div>'; return;
  }
  const bonus = state.promos[code];
  u.balance += bonus;
  u.usedPromos.push(code);
  addTx(u, 'in', bonus, 'tx_promo');
  addActivity(u, 'act_promo', { amount: fmtMoney(bonus) });
  save();
  document.getElementById('promo-code').value = '';
  renderPromo();
  box.innerHTML = '<div class="flash flash-ok">✓ '+t('msg_promo_ok')+fmtMoney(bonus)+' '+t('som')+'</div>';
  updateNav(); renderDrawer();
}

function renderTx(){
  const u = user();
  const box = document.getElementById('tx-box');
  if (!u.transactions.length){
    box.innerHTML = '<div class="empty"><div class="ic">📋</div><p>'+t('p_tx_empty')+'</p></div>'; return;
  }
  box.innerHTML = '<table><thead><tr><th>'+t('p_tx_date')+'</th><th>'+t('p_tx_desc')+'</th><th>'+t('p_tx_amount')+'</th><th>'+t('p_tx_type')+'</th></tr></thead><tbody>' +
    u.transactions.map(x => {
      const sign = x.type==='in' ? '+' : '−';
      const cls = x.type==='in' ? 'badge-in' : 'badge-out';
      const lab = x.type==='in' ? '↑' : '↓';
      return '<tr><td>'+fmtTime(x.time)+'</td><td>'+esc(tf(x.descKey, x.params))+'</td><td><b>'+sign+fmtMoney(x.amount)+'</b></td><td><span class="badge '+cls+'">'+lab+'</span></td></tr>';
    }).join('') + '</tbody></table>';
}

function renderActivity(){
  const u = user();
  const box = document.getElementById('activity-box');
  if (!u.activity.length){
    box.innerHTML = '<div class="empty"><div class="ic">📊</div><p>'+t('p_activity_empty')+'</p></div>'; return;
  }
  box.innerHTML = u.activity.map(a =>
    '<div class="tl-item"><div class="tl-dot">▪</div><div class="tl-body"><div class="txt">'+esc(tf(a.key, a.params))+'</div><div class="time">'+fmtTime(a.time)+'</div></div></div>'
  ).join('');
}

function renderNotif(){
  const u = user();
  const box = document.getElementById('notif-box');
  if (!state.notifs.length){
    box.innerHTML = '<div class="empty"><div class="ic">🔔</div><p>'+t('p_notif_empty')+'</p></div>'; return;
  }
  box.innerHTML = state.notifs.map(n =>
    '<div class="ann-item'+(n.kind==='warn'?' warn':'')+'"><span class="ai">'+n.icon+'</span><span>'+t(n.id)+'</span></div>'
  ).join('');
}
function markAllRead(){
  const u = user();
  state.notifs.forEach(n => { if (!u.readNotifs.includes(n.id)) u.readNotifs.push(n.id); });
  addActivity(u, 'act_notif');
  save();
  renderNotif(); renderDrawer();
  const box = document.querySelector('#page-notif .card');
  const f = document.createElement('div'); f.className='flash flash-ok'; f.textContent='✓ '+t('msg_notif_read');
  box.appendChild(f);
  setTimeout(()=> f.remove(), 2500);
}

function deleteAccount(){
  const u = user();
  if (!confirm('Delete account "'+u.nick+'"?')) return;
  delete state.users[state.current];
  state.current = null;
  save();
  doLogout();
}

function renderContact(){
  const u = user();
  document.getElementById('contact-msg').innerHTML = '';
  const box = document.getElementById('chat-box');
  if (!u.messages.length){
    box.innerHTML = '<div class="empty" style="padding:30px"><div class="ic">💬</div><p>'+t('chat_empty')+'</p></div>';
    return;
  }
  box.innerHTML = u.messages.map(m => {
    const cls = m.from === 'user' ? 'user' : 'admin';
    const who = m.from === 'user' ? t('you') : t('admin_lbl');
    return '<div class="chat-msg '+cls+'">'+esc(m.text)+'<div class="meta">'+who+' · '+fmtTime(m.time)+'</div></div>';
  }).join('');
  let changed = false;
  u.messages.forEach(m => { if (m.from === 'admin' && !m.readByUser){ m.readByUser = true; changed = true; } });
  if (changed){ save(); renderDrawer(); }
  box.scrollTop = box.scrollHeight;
}
function doContact(){
  const u = user();
  const text = document.getElementById('contact-text').value.trim();
  const box = document.getElementById('contact-msg');
  if (!text){ box.innerHTML = '<div class="flash flash-err">⚠ '+t('msg_contact_empty')+'</div>'; return; }
  u.messages.push({ from:'user', text, time: Date.now(), readByAdmin:false, readByUser:true });
  addActivity(u, 'act_contact');
  save();
  document.getElementById('contact-text').value = '';
  renderContact();
  box.innerHTML = '<div class="flash flash-ok">✓ '+t('msg_contact_ok')+'</div>';
  renderDrawer();
}

function renderAdmin(){
  const u = user();
  const users = Object.values(state.users).filter(x => !x.isAdmin);
  const allBots = [];
  users.forEach(x => (x.bots||[]).forEach((b, i) => allBots.push(Object.assign({}, b, { nick:x.nick, idx:i }))));
  setText('ad-users', users.length);
  setText('ad-bots', allBots.length);
  setText('ad-earned', fmtMoney(state.earned || 0));
  setText('ad-fr-pending', state.fileRequests.filter(f => f.status==='pending').length);
  setText('ad-unread-msgs', adminUnreadCount());
  document.getElementById('ad-card').value = state.card;
  renderAdminPromos();
  renderFileReqs();
  const bbox = document.getElementById('ad-bots-box');
  if (!allBots.length){ bbox.innerHTML = '<p style="color:var(--muted)">'+t('p_admin_nobots')+'</p>'; }
  else {
    bbox.innerHTML = '<table><thead><tr><th>'+t('p_admin_user')+'</th><th>'+t('p_admin_file')+'</th><th>'+t('p_admin_fr_file')+'</th><th>'+t('p_admin_status')+'</th></tr></thead><tbody>' +
      allBots.map(b => '<tr><td>'+esc(b.nick)+'</td><td>🤖 '+esc(b.file)+'</td><td>'+(b.files||[]).length+'</td><td><span class="badge '+(b.status==='active'?'badge-active':'badge-pending')+'">'+t('status_'+b.status)+'</span></td></tr>').join('') + '</tbody></table>';
  }
  const ubox = document.getElementById('ad-users-box');
  if (!users.length){ ubox.innerHTML = '<p style="color:var(--muted)">'+t('p_admin_msgs_none')+'</p>'; }
  else {
    ubox.innerHTML = '<table><thead><tr><th>'+t('p_admin_user')+'</th><th>'+t('p_admin_fr_owner')+'</th><th>'+t('p_admin_bots')+'</th><th>'+t('stat_balance')+'</th></tr></thead><tbody>' +
      users.map(x => '<tr><td>'+esc(x.nick)+'</td><td><code>'+x.clientId+'</code></td><td>'+(x.bots||[]).length+'</td><td>'+fmtMoney(x.balance)+'</td></tr>').join('') + '</tbody></table>';
  }
}
function renderAdminPromos(){
  const box = document.getElementById('ad-promo-list');
  const codes = Object.keys(state.promos);
  if (!codes.length){ box.innerHTML = '<p style="color:var(--muted)">'+t('p_admin_promo_none')+'</p>'; return; }
  box.innerHTML = codes.map(code =>
    '<div class="promo-row"><span class="pc">'+esc(code)+'</span><span>+'+fmtMoney(state.promos[code])+' '+t('som')+'</span><button class="btn btn-danger btn-sm" onclick="deletePromo(\''+esc(code)+'\')">'+t('p_admin_promo_delete')+'</button></div>'
  ).join('');
}
function addPromo(){
  const u = user();
  const code = document.getElementById('ad-promo-code').value.trim().toUpperCase();
  const amount = parseInt(document.getElementById('ad-promo-amount').value, 10);
  const box = document.getElementById('ad-promo-msg');
  if (!code || code.length < 3){ box.innerHTML = '<div class="flash flash-err">⚠ '+t('err_nickshort')+'</div>'; return; }
  if (!amount || amount < 1){ box.innerHTML = '<div class="flash flash-err">⚠ '+t('msg_topup_min')+'</div>'; return; }
  state.promos[code] = amount;
  addActivity(u, 'act_promo_create', { code });
  save();
  document.getElementById('ad-promo-code').value = '';
  document.getElementById('ad-promo-amount').value = '';
  renderAdminPromos();
  box.innerHTML = '<div class="flash flash-ok">✓ '+t('msg_promo_added')+': '+esc(code)+' (+'+fmtMoney(amount)+')</div>';
}
function deletePromo(code){
  if (!state.promos[code]) return;
  delete state.promos[code];
  save();
  renderAdminPromos();
}
function renderFileReqs(){
  const box = document.getElementById('ad-fr-box');
  if (!state.fileRequests.length){ box.innerHTML = '<p style="color:var(--muted)">'+t('p_admin_fr_none')+'</p>'; return; }
  box.innerHTML = '<table><thead><tr><th>'+t('p_admin_fr_owner')+'</th><th>'+t('p_admin_fr_bot')+'</th><th>'+t('p_admin_fr_file')+'</th><th>'+t('p_admin_fr_date')+'</th><th>'+t('p_admin_fr_status')+'</th><th></th></tr></thead><tbody>' +
    state.fileRequests.slice().reverse().map(f => '<tr><td>'+esc(f.nick)+'</td><td>🤖 '+esc(f.botFile)+'</td><td>📄 '+esc(f.newFile)+'</td><td>'+fmtTime(f.time)+'</td><td><span class="badge '+(f.status==='pending'?'badge-pending':'badge-active')+'">'+t(f.status==='pending'?'fr_pending':'fr_done')+'</span></td><td>'+(f.status==='pending'?'<button class="btn btn-success btn-sm" onclick="approveFile(\''+f.id+'\')">'+t('p_admin_approve')+'</button>':'')+'</td></tr>').join('') + '</tbody></table>';
}
function approveFile(id){
  const u = user();
  const f = state.fileRequests.find(x => String(x.id) === String(id));
  if (!f) return;
  f.status = 'done';
  addActivity(u, 'act_fr_approve');
  save();
  renderFileReqs();
  setText('ad-fr-pending', state.fileRequests.filter(x => x.status==='pending').length);
}
function saveCard(){
  state.card = document.getElementById('ad-card').value.trim() || state.card;
  save();
  document.getElementById('ad-msg').innerHTML = '<div class="flash flash-ok">✓ '+t('msg_card_saved')+'</div>';
}

/* ============================================================
   BOT VIEW (files / console / logs)
   ============================================================ */
function openBotView(id){
  currentBotId = String(id);
  showPage('botview');
}
function renderBotView(){
  const b = findBot(currentBotId);
  const titleEl = document.getElementById('bv-title');
  if (!b){
    titleEl.textContent = t('p_botview_notfound');
    ['bv-info','bv-files','bv-console','bv-logs'].forEach(id => { const e=document.getElementById(id); if(e) e.innerHTML=''; });
    return;
  }
  titleEl.innerHTML = '🤖 <span class="bt-file">'+esc(b.file)+'</span> <span class="badge '+(b.status==='active'?'badge-active':'badge-pending')+'">'+t('status_'+b.status)+'</span>';
  document.getElementById('bv-info').innerHTML =
    '<div class="bi"><div class="bk">'+t('p_botview_plan')+'</div><div class="bv">'+t('planname_'+b.plan)+(b.plan==='daily'?' ('+b.days+' '+t('days_word')+')':'')+'</div></div>' +
    '<div class="bi"><div class="bk">'+t('p_mybots_price')+'</div><div class="bv">'+fmtMoney(b.price)+' '+t('som')+'</div></div>' +
    '<div class="bi"><div class="bk">'+t('p_botview_created')+'</div><div class="bv">'+fmtTime(b.createdAt)+'</div></div>' +
    '<div class="bi"><div class="bk">'+t('p_botview_files')+'</div><div class="bv">'+(b.files||[]).length+'</div></div>';
  renderBotFiles(b);
  updateConsoleEl(b);
  renderBotLogs(b);
  const fm = document.getElementById('bv-file-msg'); if (fm) fm.innerHTML = '';
  const fi = document.getElementById('bv-file-input'); if (fi) fi.value = '';
  if (b.started) startBotTimer(b);
}
function renderBotFiles(b){
  const box = document.getElementById('bv-files');
  if (!(b.files||[]).length){ box.innerHTML = '<p style="color:var(--muted);font-size:.85rem">'+t('p_botview_nofiles')+'</p>'; return; }
  box.innerHTML = b.files.map(f => '<div class="file-item"><span>📄</span><span class="fn">'+esc(f)+'</span></div>').join('');
}
function renderBotLogs(b){
  const box = document.getElementById('bv-logs');
  if (!(b.logs||[]).length){ box.innerHTML = '<p style="color:var(--muted);font-size:.85rem">'+t('p_activity_empty')+'</p>'; return; }
  box.innerHTML = b.logs.slice().reverse().map(l => '<div class="log-item"><span class="lt">'+fmtTime(l.time)+'</span>'+esc(tf(l.key, l.params))+'</div>').join('');
}
function updateConsoleEl(b){
  const el = document.getElementById('bv-console'); if (!el) return;
  el.innerHTML = (b.console||[]).join('\n') || '<span class="dim">'+t('console_ready')+'</span>';
  el.scrollTop = el.scrollHeight;
}
function pushConsoleLine(b, line){
  b.console = b.console || [];
  b.console.push('['+nowTs()+'] '+line);
  if (b.console.length > 200) b.console.shift();
}
function startBotTimer(b){
  if (botTimers[b.id]) return;
  botTimers[b.id] = setInterval(() => {
    const bb = findBot(b.id);
    if (!bb || !bb.started || String(currentBotId) !== String(b.id) || !document.getElementById('page-botview').classList.contains('active')){
      if (botTimers[b.id]){ clearInterval(botTimers[b.id]); delete botTimers[b.id]; }
      return;
    }
    pushConsoleLine(bb, LOG_POOL[Math.floor(Math.random()*LOG_POOL.length)]);
    updateConsoleEl(bb);
    if (bb.console.length % 5 === 0) save();
  }, 1500);
}
function addBotFile(){
  const u = user();
  const b = findBot(currentBotId);
  const box = document.getElementById('bv-file-msg');
  if (!b) return;
  const file = document.getElementById('bv-file-input').value.trim();
  if (!file){ box.innerHTML = '<div class="flash flash-err">⚠ '+t('msg_file_needname')+'</div>'; return; }
  b.files = b.files || [];
  b.files.push(file);
  pushConsoleLine(b, 'File added: '+file);
  b.logs = b.logs || [];
  b.logs.push({ key:'log_file_added', params:{ file }, time: Date.now() });
  state.fileRequests.push({ id: Date.now()+Math.floor(Math.random()*100000), nick: u.nick, botId: b.id, botFile: b.file, newFile: file, time: Date.now(), status:'pending' });
  addActivity(u, 'act_file_added', { file });
  save();
  box.innerHTML = '<div class="flash flash-ok">✓ '+t('msg_file_added')+'</div>';
  document.getElementById('bv-file-input').value = '';
  renderBotFiles(b);
  renderBotLogs(b);
  updateConsoleEl(b);
}
function runBot(){
  const b = findBot(currentBotId); if (!b) return;
  if (botTimers[b.id]) return;
  b.started = true;
  pushConsoleLine(b, '<span class="ok">'+t('console_started')+'</span>');
  ['Initializing bot...','Loading modules...','Connecting to Telegram API...','Polling started','Bot is online ✓'].forEach(l => b.console.push('['+nowTs()+'] '+l));
  b.logs = b.logs || [];
  b.logs.push({ key:'log_started', params:{}, time: Date.now() });
  const u = user();
  addActivity(u, 'act_bot_run', { file: b.file });
  save();
  updateConsoleEl(b);
  renderBotLogs(b);
  startBotTimer(b);
}
function stopBot(){
  const b = findBot(currentBotId); if (!b) return;
  if (botTimers[b.id]){ clearInterval(botTimers[b.id]); delete botTimers[b.id]; }
  b.started = false;
  pushConsoleLine(b, '<span class="warn">'+t('console_stopped')+'</span>');
  b.logs = b.logs || [];
  b.logs.push({ key:'log_stopped', params:{}, time: Date.now() });
  const u = user();
  addActivity(u, 'act_bot_stop', { file: b.file });
  save();
  updateConsoleEl(b);
  renderBotLogs(b);
}
function clearConsole(){
  const b = findBot(currentBotId); if (!b) return;
  if (botTimers[b.id]){ clearInterval(botTimers[b.id]); delete botTimers[b.id]; b.started = false; }
  b.console = [];
  b.logs = b.logs || [];
  b.logs.push({ key:'log_cleared', params:{}, time: Date.now() });
  save();
  updateConsoleEl(b);
  renderBotLogs(b);
}

/* ============================================================
   MESSAGES (customer inbox / admin inbox + reply)
   ============================================================ */
let adminMsgTarget = null;
function renderMessages(){
  const u = user();
  const box = document.getElementById('messages-box');
  if (u.isAdmin){
    const users = Object.values(state.users).filter(x => !x.isAdmin && (x.messages||[]).length);
    if (!users.length){
      adminMsgTarget = null;
      box.innerHTML = '<div class="empty"><div class="ic">💬</div><p>'+t('p_admin_msgs_none')+'</p></div>';
      return;
    }
    if (!adminMsgTarget || !state.users[adminMsgTarget]) adminMsgTarget = users[0].nick;
    const convList = users.map(c => {
      const unread = (c.messages||[]).filter(m => m.from==='user' && !m.readByAdmin).length;
      const last = c.messages[c.messages.length-1];
      return '<div class="conv-card'+(adminMsgTarget===c.nick?' active':'')+'" onclick="openConv(\''+esc(c.nick)+'\')"><div class="ca">'+esc(c.nick.charAt(0).toUpperCase())+'</div><div class="cb"><div class="cn">'+esc(c.nick)+'</div><div class="cl">'+esc(last? last.text : '')+'</div></div>'+(unread?'<span class="cu">'+unread+'</span>':'')+'</div>';
    }).join('');
    const target = state.users[adminMsgTarget];
    let changed = false;
    target.messages.forEach(m => { if (m.from==='user' && !m.readByAdmin){ m.readByAdmin = true; changed = true; } });
    if (changed) save();
    const thread = target.messages.map(m => {
      const cls = m.from === 'user' ? 'user' : 'admin';
      const who = m.from === 'user' ? target.nick : t('admin_lbl');
      return '<div class="chat-msg '+cls+'">'+esc(m.text)+'<div class="meta">'+esc(who)+' · '+fmtTime(m.time)+'</div></div>';
    }).join('');
    box.innerHTML = '<div class="msg-layout"><div class="conv-list">'+convList+'</div><div><div class="chat-box" id="admin-chat-box">'+(thread||'<div class="empty" style="padding:20px"><p>'+t('p_messages_none')+'</p></div>')+'</div><div class="chat-input"><input class="form-control" id="admin-reply-input" data-i18n-ph="p_admin_msgs_reply_ph" onkeypress="if(event.key===\'Enter\')adminReply()"><button class="btn btn-primary" data-i18n="p_admin_msgs_reply_btn" onclick="adminReply()"></button></div></div></div>';
    const cb = document.getElementById('admin-chat-box'); if (cb) cb.scrollTop = cb.scrollHeight;
    if (changed) renderDrawer();
    return;
  }
  const uu = userUnreadAdminCount(u);
  const last = u.messages.length ? u.messages[u.messages.length-1] : null;
  box.innerHTML = '<div class="conv-card" onclick="showPage(\'contact\')"><div class="ca">A</div><div class="cb"><div class="cn">'+t('p_messages_admin')+'</div><div class="cl">'+esc(last? last.text : t('chat_empty'))+'</div></div>'+(uu?'<span class="cu">'+uu+'</span>':'')+'</div>';
}
function openConv(nick){ adminMsgTarget = nick; renderMessages(); }
function adminReply(){
  const u = user();
  if (!adminMsgTarget || !state.users[adminMsgTarget]) return;
  const text = document.getElementById('admin-reply-input').value.trim();
  if (!text) return;
  const target = state.users[adminMsgTarget];
  target.messages.push({ from:'admin', text, time: Date.now(), readByAdmin:true, readByUser:false });
  addActivity(target, 'act_admin_reply');
  save();
  document.getElementById('admin-reply-input').value = '';
  renderMessages();
  renderDrawer();
}

document.getElementById('login-pass').addEventListener('keypress', e => { if (e.key === 'Enter') doLogin(); });

  enterApp();
}
